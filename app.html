<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Oyatlar Uz — Qur'on</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f4f7f4;
  color: #173f35;
}

header {
  background: #064f3e;
  color: white;
  padding: 20px;
  text-align: center;
  position: sticky;
  top: 0;
  z-index: 10;
}

header h1 {
  margin: 0;
  color: #f2d16b;
}

.container {
  max-width: 700px;
  margin: auto;
  padding: 20px;
}

.subtitle {
  text-align: center;
  color: #666;
  margin-bottom: 20px;
}

.sura {
  background: white;
  border-radius: 18px;
  padding: 20px;
  margin-bottom: 14px;
  box-shadow: 0 3px 12px rgba(0,0,0,.08);
  cursor: pointer;
  transition: .2s;
}

.sura:active {
  transform: scale(.98);
}

.sura-number {
  display: inline-flex;
  width: 38px;
  height: 38px;
  border-radius: 50%;
  background: #064f3e;
  color: white;
  align-items: center;
  justify-content: center;
  margin-right: 10px;
}

.sura-name {
  font-size: 20px;
  font-weight: bold;
}

.sura-info {
  margin-top: 8px;
  color: #777;
  font-size: 14px;
}

.oyat-page {
  display: none;
  min-height: 100vh;
  background: #064f3e;
  color: white;
  padding: 25px 18px 50px;
  text-align: center;
}

.oyat-page.active {
  display: block;
}

.arab {
  direction: rtl;
  font-size: 35px;
  line-height: 2.1;
  margin: 35px 0;
}

.translation {
  font-size: 20px;
  line-height: 1.7;
  background: rgba(255,255,255,.08);
  padding: 20px;
  border-radius: 18px;
}

.tafsir {
  margin-top: 18px;
  background: rgba(255,255,255,.08);
  padding: 20px;
  border-radius: 18px;
  line-height: 1.6;
}

.back {
  margin-top: 25px;
  padding: 13px 28px;
  border: 0;
  border-radius: 30px;
  background: #d1ad3f;
  color: white;
  font-size: 16px;
}

.audio {
  margin-top: 20px;
  padding: 13px 25px;
  border: 0;
  border-radius: 30px;
  background: white;
  color: #064f3e;
  font-size: 16px;
}
</style>
</head>

<body>

<header>
  <h1>📖 Oyatlar Uz</h1>
</header>

<div id="suralar" class="container">

  <h2>Qur'on suralari</h2>

  <p class="subtitle">
    O'rganish uchun surani tanlang
  </p>

  <div class="sura" onclick="ochSura('fotiha')">
    <span class="sura-number">1</span>
    <span class="sura-name">Al-Fotiha</span>
    <div class="sura-info">7 oyat</div>
  </div>

  <div class="sura" onclick="ochSura('ixlos')">
    <span class="sura-number">112</span>
    <span class="sura-name">Al-Ixlos</span>
    <div class="sura-info">4 oyat</div>
  </div>

  <div class="sura" onclick="ochSura('falaq')">
    <span class="sura-number">113</span>
    <span class="sura-name">Al-Falaq</span>
    <div class="sura-info">5 oyat</div>
  </div>

  <div class="sura" onclick="ochSura('nos')">
    <span class="sura-number">114</span>
    <span class="sura-name">An-Nos</span>
    <div class="sura-info">6 oyat</div>
  </div>

  <div class="sura" onclick="ochSura('masad')">
    <span class="sura-number">111</span>
    <span class="sura-name">Al-Masad</span>
    <div class="sura-info">5 oyat</div>
  </div>

</div>


<!-- OYAT SAHIFASI -->

<div id="oyatPage" class="oyat-page">

  <h2 id="suraTitle"></h2>

  <div id="oyatNumber"></div>

  <div id="arab" class="arab"></div>

  <div id="translation" class="translation"></div>

  <div id="tafsir" class="tafsir"></div>

  <button class="audio">
    🔊 Tinglash
  </button>

  <br>

  <button class="back" onclick="orqaga()">
    ← Suralarga qaytish
  </button>

</div>


<script>

const suralar = {

  fotiha: {
    nom: "Al-Fotiha",
    oyatlar: [
      "بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ",
      "الْحَمْدُ لِلَّهِ رَبِّ الْعَالَمِينَ",
      "الرَّحْمَٰنِ الرَّحِيمِ",
      "مَالِكِ يَوْمِ الدِّينِ",
      "إِيَّاكَ نَعْبُدُ وَإِيَّاكَ نَسْتَعِينُ",
      "اهْدِنَا الصِّرَاطَ الْمُسْتَقِيمَ",
      "صِرَاطَ الَّذِينَ أَنْعَمْتَ عَلَيْهِمْ"
    ]
  },

  ixlos: {
    nom: "Al-Ixlos",
    oyatlar: [
      "قُلْ هُوَ اللَّهُ أَحَدٌ",
      "اللَّهُ الصَّمَدُ",
      "لَمْ يَلِدْ وَلَمْ يُولَدْ",
      "وَلَمْ يَكُنْ لَهُ كُفُوًا أَحَدٌ"
    ]
  },

  falaq: {
    nom: "Al-Falaq",
    oyatlar: [
      "قُلْ أَعُوذُ بِرَبِّ الْفَلَقِ",
      "مِنْ شَرِّ مَا خَلَقَ",
      "وَمِنْ شَرِّ غَاسِقٍ إِذَا وَقَبَ",
      "وَمِنْ شَرِّ النَّفَّاثَاتِ فِي الْعُقَدِ",
      "وَمِنْ شَرِّ حَاسِدٍ إِذَا حَسَدَ"
    ]
  },

  nos: {
    nom: "An-Nos",
    oyatlar: [
      "قُلْ أَعُوذُ بِرَبِّ النَّاسِ",
      "مَلِكِ النَّاسِ",
      "إِلَٰهِ النَّاسِ",
      "مِنْ شَرِّ الْوَسْوَاسِ الْخَنَّاسِ",
      "الَّذِي يُوَسْوِسُ فِي صُدُورِ النَّاسِ",
      "مِنَ الْجِنَّةِ وَالنَّاسِ"
    ]
  },

  masad: {
    nom: "Al-Masad",
    oyatlar: [
      "تَبَّتْ يَدَا أَبِي لَهَبٍ وَتَبَّ",
      "مَا أَغْنَىٰ عَنْهُ مَالُهُ وَمَا كَسَبَ",
      "سَيَصْلَىٰ نَارًا ذَاتَ لَهَبٍ",
      "وَامْرَأَتُهُ حَمَّالَةَ الْحَطَبِ",
      "فِي جِيدِهَا حَبْلٌ مِنْ مَسَدٍ"
    ]
  }

};


function ochSura(sura) {

  document.getElementById("suralar").style.display = "none";

  const data = suralar[sura];

  document.getElementById("oyatPage").classList.add("active");

  document.getElementById("suraTitle").innerText =
    data.nom;

  document.getElementById("oyatNumber").innerText =
    data.oyatlar.length + " oyat";

  document.getElementById("arab").innerText =
    data.oyatlar[0];

  document.getElementById("translation").innerText =
    "O'zbekcha tarjima bu yerga ulanadi.";

  document.getElementById("tafsir").innerText =
    "Tafsir ma'lumoti bu yerga ulanadi.";

}


function orqaga() {

  document.getElementById("oyatPage").classList.remove("active");

  document.getElementById("suralar").style.display =
    "block";

}

</script>

</body>
</html>
